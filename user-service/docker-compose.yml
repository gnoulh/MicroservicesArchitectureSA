version: "3.8"

services:
  mongo:
    image: mongo:4.4
    container_name: todo-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  todo-user-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: todo-user-service
    depends_on:
      - mongo
    environment:
      - MONGO_URL=mongodb://todo-mongo:27017/todoapp
    ports:
      - "8084:8084"

volumes:
  mongo-data:
