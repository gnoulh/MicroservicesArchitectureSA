version: '2'

services:
    project-db:
      image: mysql:8.0
      hostname: project-db
      restart: always
      ports:
        - "3307:3306"
      environment:
        - MYSQL_ROOT_PASSWORD=root_pass
        - MYSQL_DATABASE=todo_projects
        - MYSQL_USER=projects_user
        - MYSQL_PASSWORD=projects_pass
      volumes:
        - project-db-data:/var/lib/mysql
        - ./src/database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
      # networks:
      #   - microservices-network

    project:
      build:
        context: .
        dockerfile: Dockerfile
      hostname: project
      restart: always
      ports:
        - "8086:8086"
      environment:
        - DB_HOST=project-db
        - DB_PORT=3306
        - DB_USER=projects_user
        - DB_PASSWORD=projects_pass
        - DB_NAME=todo_projects
        - PORT=8086
      depends_on:
        - project-db
      # networks:
      #   - microservices-network

volumes:
  project-db-data: