version: '3.8'

networks:
  todo-network:
    driver: bridge

services:
  # API Gateway
  kong:
    build: ./api-gateway
    container_name: todo-kong
    ports:
      - "8000:8000"  # Proxy port
      - "8001:8001"  # Admin API
    environment:
      - KONG_DATABASE=off
      - KONG_PG_HOST=kong-postgres
      - KONG_PG_USER=kong
      - KONG_PG_PASSWORD=kong
    depends_on:
      - kong-postgres
    networks:
      - todo-network
    restart: unless-stopped

  kong-postgres:
    image: postgres:13
    container_name: kong-postgres
    environment:
      POSTGRES_DB: kong
      POSTGRES_USER: kong
      POSTGRES_PASSWORD: kong
    volumes:
      - kong_postgres_data:/var/lib/postgresql/data
    networks:
      - todo-network
    restart: unless-stopped

  user-service:
    build: ./user-service
    container_name: todo-user-service
    ports:
      - "8081:8081"
    environment:
      - CONSUL_HTTP_ADDR=consul:8500
      - SERVICE_NAME=user-service
      - SERVICE_ID=user-service-1
      - SERVICE_PORT=8081
      - MONGO_URL=mongodb://user-mongo:27017/users
    depends_on:
      - consul
      - user-mongo
    networks:
      - todo-network
    restart: unless-stopped

  task-service:
    build: ./task-service
    container_name: todo-task-service
    ports:
      - "8082:8082"
    environment:
      - CONSUL_HTTP_ADDR=consul:8500
      - SERVICE_NAME=task-service
      - SERVICE_ID=task-service-1
      - SERVICE_PORT=8082
      - DB_HOST=task-postgres
      - DB_NAME=tasks
      - DB_USER=postgres
      - DB_PASSWORD=postgres
    depends_on:
      - consul
      - task-postgres
    networks:
      - todo-network
    restart: unless-stopped

  project-service:
    build: ./project-service
    container_name: todo-project-service
    ports:
      - "8083:8083"
    environment:
      - CONSUL_HTTP_ADDR=consul:8500
      - SERVICE_NAME=project-service
      - SERVICE_ID=project-service-1
      - SERVICE_PORT=8083
      - DB_HOST=project-mysql
      - DB_NAME=projects
      - DB_USER=root
      - DB_PASSWORD=rootpassword
    depends_on:
      - consul
      - project-mysql
    networks:
      - todo-network
    restart: unless-stopped

  notification-service:
    build: ./notification-service
    container_name: todo-notification-service
    ports:
      - "8087:8087"
    environment:
      - CONSUL_HTTP_ADDR=consul:8500
      - SERVICE_NAME=notification-service
      - SERVICE_ID=notification-service-1
      - SERVICE_PORT=8087
      - REDIS_URL=redis://notification-redis:6379
      - CELERY_BROKER=redis://notification-redis:6379/0
    depends_on:
      - consul
      - notification-redis
    networks:
      - todo-network
    restart: unless-stopped

  analytics-service:
    build: ./analytics-service
    container_name: todo-analytics-service
    ports:
      - "8088:8088"
    environment:
      - CONSUL_HTTP_ADDR=consul:8500
      - SERVICE_NAME=analytics-service
      - SERVICE_ID=analytics-service-1
      - SERVICE_PORT=8088
      - INFLUXDB_URL=http://influxdb:8086
      - INFLUXDB_TOKEN=my-token
      - INFLUXDB_ORG=todo-org
      - INFLUXDB_BUCKET=analytics
    depends_on:
      - consul
      - influxdb
    networks:
      - todo-network
    restart: unless-stopped

  collaboration-service:
    build: ./collaboration-service
    container_name: todo-collaboration-service
    ports:
      - "8089:8089"
    environment:
      - CONSUL_HTTP_ADDR=consul:8500
      - SERVICE_NAME=collaboration-service
      - SERVICE_ID=collaboration-service-1
      - SERVICE_PORT=8089
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=password
    depends_on:
      - consul
      - neo4j
    networks:
      - todo-network
    restart: unless-stopped

  # Databases
  user-mongo:
    image: mongo:5.0
    container_name: user-mongo
    ports:
      - "27017:27017"
    volumes:
      - user_mongo_data:/data/db
    networks:
      - todo-network

  task-postgres:
    image: postgres:13
    container_name: task-postgres
    environment:
      POSTGRES_DB: tasks
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - task_postgres_data:/var/lib/postgresql/data
    networks:
      - todo-network

  project-mysql:
    image: mysql:8.0
    container_name: project-mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: projects
    volumes:
      - project_mysql_data:/var/lib/mysql
    networks:
      - todo-network

  notification-redis:
    image: redis:7-alpine
    container_name: notification-redis
    ports:
      - "6379:6379"
    volumes:
      - notification_redis_data:/data
    networks:
      - todo-network

  influxdb:
    image: influxdb:2.7
    container_name: todo-influxdb
    ports:
      - "8086:8086"
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=adminpassword
      - DOCKER_INFLUXDB_INIT_ORG=todo-org
      - DOCKER_INFLUXDB_INIT_BUCKET=analytics
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=my-token
    volumes:
      - influxdb_data:/var/lib/influxdb2
    networks:
      - todo-network

  neo4j:
    image: neo4j:5.5
    container_name: todo-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/password
    volumes:
      - neo4j_data:/data
    networks:
      - todo-network

  rabbitmq:
    image: rabbitmq:3-management
    container_name: todo-rabbitmq
    ports:
      - "5672:5672"      # AMQP port
      - "15672:15672"    # Management UI
    environment:
      RABBITMQ_DEFAULT_USER: todouser
      RABBITMQ_DEFAULT_PASS: todopass123
      RABBITMQ_DEFAULT_VHOST: todo_vhost
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - todo-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

  consul:
    image: consul:1.15.3
    container_name: consul
    ports:
      - "8500:8500"
      - "8600:8600/udp"
    command: >
      consul agent -server -ui -node=server-1 -bootstrap-expect=1
      -client=0.0.0.0 -datacenter=dc1
    environment:
      - CONSUL_BIND_INTERFACE=eth0
    volumes:
      - consul_data:/consul/data
    networks:
      - microservices-network
    healthcheck:
      test: ["CMD", "consul", "members"]
      interval: 10s
      timeout: 3s
      retries: 3

  # Monitoring
  grafana:
    image: grafana/grafana:10.0.0
    container_name: todo-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - todo-network

volumes:
  kong_postgres_data:
  user_mongo_data:
  task_postgres_data:
  project_mysql_data:
  notification_redis_data:
  influxdb_data:
  neo4j_data:
  rabbitmq_data:
  consul_data:
  grafana_data: