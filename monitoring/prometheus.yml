global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  # - "first_rules.yml"
  # - "second_rules.yml"

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'consul'
    static_configs:
      - targets: ['consul:8500']

  - job_name: 'consul-exporter'
    static_configs:
      - targets: ['consul-exporter:9107']

  - job_name: 'user-service'
    consul_sd_configs:
      - server: 'consul:8500'
        services: ['user-service']
    relabel_configs:
      - source_labels: [__meta_consul_service]
        target_label: job
      - source_labels: [__meta_consul_service_id]
        target_label: instance

  - job_name: 'task-service'
    consul_sd_configs:
      - server: 'consul:8500'
        services: ['task-service']
    relabel_configs:
      - source_labels: [__meta_consul_service]
        target_label: job
      - source_labels: [__meta_consul_service_id]
        target_label: instance

  - job_name: 'project-service'
    consul_sd_configs:
      - server: 'consul:8500'
        services: ['project-service']
    relabel_configs:
      - source_labels: [__meta_consul_service]
