_format_version: "3.0"
_transform: true

services:
  - name: user-service
    url: http://user-service:8081
    routes:
      - name: user-routes
        paths:
          - /api/v1/users
        methods:
          - GET
          - POST
          - PUT
          - DELETE
    plugins:
      - name: rate-limiting
        config:
          minute: 100
          hour: 1000
      - name: cors
        config:
          origins:
            - "*"
          methods:
            - GET
            - POST
            - PUT
            - DELETE
          headers:
            - Accept
            - Accept-Version
            - Content-Length
            - Content-MD5
            - Content-Type
            - Date
            - Authorization

  - name: task-service
    url: http://task-service:8082
    routes:
      - name: task-routes
        paths:
          - /api/v1/tasks
        methods:
          - GET
          - POST
          - PUT
          - DELETE
    plugins:
      - name: rate-limiting
        config:
          minute: 200
          hour: 2000
      - name: cors
        config:
          origins:
            - "*"

  - name: project-service
    url: http://project-service:8083
    routes:
      - name: project-routes
        paths:
          - /api/v1/projects
        methods:
          - GET
          - POST
          - PUT
          - DELETE
    plugins:
      - name: rate-limiting
        config:
          minute: 150
          hour: 1500

  - name: notification-service
    url: http://notification-service:8087
    routes:
      - name: notification-routes
        paths:
          - /api/v1/notifications
        methods:
          - GET
          - POST
          - PUT
    plugins:
      - name: rate-limiting
        config:
          minute: 50
          hour: 500

  - name: analytics-service
    url: http://analytics-service:8088
    routes:
      - name: analytics-routes
        paths:
          - /api/v1/analytics
        methods:
          - GET
          - POST
    plugins:
      - name: rate-limiting
        config:
          minute: 30
          hour: 300

  - name: collaboration-service
    url: http://collaboration-service:8089
    routes:
      - name: collaboration-routes
        paths:
          - /api/v1/collaboration
        methods:
          - GET
          - POST
          - PUT
    plugins:
      - name: rate-limiting
        config:
          minute: 80
          hour: 800

