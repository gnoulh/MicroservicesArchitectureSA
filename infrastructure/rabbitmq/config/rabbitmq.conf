# RabbitMQ Configuration for Todo App
default_vhost = todo_vhost
default_user = todouser
default_pass = todopass123
default_permissions.configure = .*
default_permissions.read = .*
default_permissions.write = .*

# Management plugin
management.tcp.port = 15672
management.tcp.ip = 0.0.0.0

# Message TTL and queue settings
default_consumer_timeout = 30000
heartbeat = 60