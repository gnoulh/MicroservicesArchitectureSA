version: '3.8'
services:
  collaboration-service:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8089:8089"
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=collaboration123
    depends_on:
      - neo4j
    # networks:
    #   - microservices-network

  neo4j:
    image: neo4j:5.13
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/collaboration123
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - neo4j_data:/data
    # networks:
    #   - microservices-network

volumes:
  neo4j_data: